services:
  kie-ai-mcp:
    build: .
    image: kie-ai-mcp-server:latest
    stdin_open: true
    environment:
      KIE_API_KEY: ${KIE_API_KEY:-}
      KIE_API_BASE_URL: ${KIE_API_BASE_URL:-https://api.kie.ai}
      KIE_UPLOAD_BASE_URL: ${KIE_UPLOAD_BASE_URL:-https://kieai.redpandaai.co}
      KIE_WEBHOOK_HMAC_KEY: ${KIE_WEBHOOK_HMAC_KEY:-}
      KIE_POLL_INTERVAL_MS: ${KIE_POLL_INTERVAL_MS:-3000}
      KIE_POLL_TIMEOUT_MS: ${KIE_POLL_TIMEOUT_MS:-600000}
      KIE_ALLOW_LOCAL_FILE_UPLOADS: ${KIE_ALLOW_LOCAL_FILE_UPLOADS:-false}
