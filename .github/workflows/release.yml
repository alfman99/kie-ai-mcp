name: Release Claude Desktop extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Claude Desktop extension
        run: npm run bundle:claude

      - name: Create checksum
        run: sha256sum release/kie-creator-for-claude.mcpb > release/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          release/kie-creator-for-claude.mcpb
          release/SHA256SUMS
          --title "KIE Creator for Claude ${GITHUB_REF_NAME}"
          --generate-notes
